#
# Chain-E comprehensive test suite (openconnector-comprehensive-tests).
#
# Three parallel merge-blocking jobs plus a final gate:
#   - phpunit    : PHPUnit + clover coverage, gated at >=80% line / >=70% branch
#                  (composer coverage:check → tests/scripts/check-coverage.php).
#   - newman     : Postman/Newman API suite against a live Nextcloud + OpenRegister.
#   - playwright : E2E regression project (--workers=4); uploads report + traces
#                  on failure.
#   - tests-gate : depends on all three; the single required status check.
#
# Path filters skip the heavy E2E/newman jobs for docs-only / openspec-only PRs.

name: Tests

on:
  # DISABLED — this workflow returns `startup_failure` on every run and has
  # never produced a result. Because `tests-gate` is a required check and
  # `playwright` is queued behind `newman`, a workflow that cannot START was
  # marking every PR against `development` red AND preventing e2e from ever
  # running. It therefore provided zero coverage while blocking everything.
  #
  # Disabled the same way this repo disabled it before (2026-02-09, "Disabled
  # workflows that do not work"): point the triggers at a branch that does not
  # exist, keeping the real ones commented directly above so re-enabling is a
  # one-line change once it actually works.
  #
  # The file itself is NOT the fault — valid YAML, all 13 inputs valid against
  # the callee's 30, `needs:` graph intact, no `uses:`+`runs-on:` conflict.
  # Most likely the reusable-workflow call needs `secrets: inherit`, or the
  # `@main` pin on ConductionNL/.github has drifted. See #1109.
  push:
    # branches: [main, development]
    branches: [never]
  pull_request:
    # branches: [main, beta, development]
    branches: [never]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit + coverage gate
    runs-on: ubuntu-latest
    # PHPUnit legs across the fleet have been measured reaching 18.9 min while
    # SUCCEEDING (shillinq) — each installs a full Nextcloud server first.
    # Bounded well above that so a slow-but-healthy run is never killed.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3 with Xdebug coverage
        uses: shivammathur/setup-php@v2
        with:
          # composer.json pins config.platform.php to 8.3; a lower runtime aborts
          # at vendor/composer/platform_check.php.
          php-version: "8.3"
          coverage: xdebug
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit with clover coverage
        env:
          XDEBUG_MODE: coverage
        run: composer test:coverage

      - name: Enforce coverage thresholds (80% line / 70% branch — merge-blocking)
        run: composer coverage:check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-coverage
          path: coverage/
          if-no-files-found: ignore

  newman:
    name: Newman API suite
    # NOTE: no `runs-on` here. A job that calls a reusable workflow via `uses:`
    # must not declare a runner — the called workflow owns that. Setting both
    # makes GitHub reject the ENTIRE file ("This run likely failed because of a
    # workflow file issue"), so tests.yml never ran at all.
    # Reuse the org-wide live-server workflow which boots db + nextcloud +
    # openregister and runs the Postman collection against it. The collection
    # path + environment + the additional openregister app are declared here so
    # this workflow is self-contained per the chain-E spec.
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: openconnector
      php-version: "8.3"
      enable-phpcs: false
      enable-psalm: false
      enable-phpstan: false
      enable-phpmetrics: false
      enable-frontend: false
      enable-eslint: false
      enable-newman: true
      newman-collection-path: "tests/postman"
      newman-environment-path: "tests/postman/openconnector.postman_environment.json"
      # ⚠️ TODO — ENABLE THIS ONE LINE ONCE ConductionNL/.github#132 IS MERGED
      # (keep in step with the identical block in code-quality.yml, which
      # carries the full rationale):
      #
      #   newman-seed-command: 'SEED_SCOPE=register bash apps/openconnector/tests/e2e/ci-seed.sh'
      #
      # Short version: without a seed the `openconnector` register does not
      # exist and all 8 fixture POSTs 404 (51 of 107 assertions). With the seed
      # the fixtures create fine, but this job's `php -S` is single-worker and
      # journey J2's self-pointing Source deadlocks it until timeout-minutes.
      enable-playwright: false
      additional-apps: '[{"repo":"ConductionNL/openregister","app":"openregister","ref":"development"}]'

  playwright:
    name: Playwright E2E regression
    # No `runs-on` — see the note on the `newman` job above.
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: openconnector
      php-version: "8.3"
      enable-phpcs: false
      enable-psalm: false
      enable-phpstan: false
      enable-phpmetrics: false
      enable-frontend: false
      enable-eslint: false
      enable-newman: false
      enable-playwright: true
      playwright-test-path: "tests/e2e/regression"
      additional-apps: '[{"repo":"ConductionNL/openregister","app":"openregister","ref":"development"}]'

  tests-gate:
    name: Tests gate
    runs-on: ubuntu-latest
    # Single-step gate: it only reads the `needs` results, no checkout, no
    # install. Seconds in practice; 10 min is pure headroom.
    timeout-minutes: 10
    needs: [phpunit, newman, playwright]
    if: always()
    steps:
      - name: Fail if any test job failed
        run: |
          if [ "${{ needs.phpunit.result }}" != "success" ] \
             || [ "${{ needs.newman.result }}" != "success" ] \
             || [ "${{ needs.playwright.result }}" != "success" ]; then
            echo "One or more test jobs failed:"
            echo "  phpunit=${{ needs.phpunit.result }}"
            echo "  newman=${{ needs.newman.result }}"
            echo "  playwright=${{ needs.playwright.result }}"
            exit 1
          fi
          echo "All test jobs passed."
