name: OpenPDD Branch Release

on:
  push:
    branches:
      - project/openpdd

jobs:
  release-management:
    runs-on: ubuntu-latest
    steps:

      # Step 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Step 2: Derive this build's version from the base version tracked in appinfo/info.xml
      # (bump the base version by hand, e.g. "0.2.9-openpdd-0.1.0", when you want a new line;
      # CI only appends a per-build run number and never commits back to the repo)
      - name: Set app env
        run: |
          echo "APP_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV
          base_version=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml)
          new_version="${base_version}.${{ github.run_number }}"
          echo "NEW_VERSION=${new_version}" >> $GITHUB_ENV
          echo "RELEASE_TAG=v${new_version}" >> $GITHUB_ENV

      # Step 3: Prepare the signing certificate and key
      - name: Prepare Signing Certificate and Key
        run: |
          echo "${{ secrets.NEXTCLOUD_SIGNING_CERT }}" > signing-cert.crt
          echo "${{ secrets.NEXTCLOUD_SIGNING_KEY }}" > signing-key.key

      # Step 4: Install Node.js
      - name: Install npm dependencies
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      # Step 5: Set up PHP
      - name: Set up PHP and install extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, gd

      # Step 6: Build
      - run: npm ci
      - run: npm run build
      - run: composer install --no-dev

      # Step 7: Copy the package files into the package directory
      - name: Copy the package files into the package
        run: |
          mkdir -p package/${{ github.event.repository.name }}
          rsync -av --progress \
            --exclude='package' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='docker' \
            --exclude='docs' \
            --exclude='website' \
            --exclude='node_modules' \
            --exclude='/src' \
            --exclude='test' \
            --exclude='package-lock.json' \
            --exclude='composer.lock' \
            --exclude='composer-setup.php' \
            --exclude='.phpunit.result.cache' \
            --exclude='phpmd.xml' \
            --exclude='signing-key.key' \
            --exclude='package.json' \
            --exclude='composer.json' \
            --exclude='coverage.txt' \
            --exclude='signing-cert.crt' \
            --exclude='docker-compose.yml' \
            --exclude='webpack.config.js' \
            --exclude='.prettierrc' \
            --exclude='psalm.xml' \
            --exclude='phpunit.xml' \
            --exclude='tsconfig.json' \
            --exclude='changelog-ci-config.json' \
            --exclude='jest.config.js' \
            --exclude='.gitattributes' \
            --exclude='.php-cs-fixer.dist.php' \
            --exclude='.gitignore' \
            --exclude='.eslintrc.js' \
            --exclude='stylelint.config.js' \
            --exclude='.babelrc' \
            --exclude='.nvmrc' \
            ./ package/${{ github.event.repository.name }}/

      # Step 8: Stamp the branch release version into the packaged info.xml only
      # (the repo's own info.xml / main version history is left untouched)
      - name: Set package version
        run: |
          sed -i "s|<version>.*</version>|<version>${{ env.NEW_VERSION }}</version>|" package/${{ github.event.repository.name }}/appinfo/info.xml

      # Step 9: Create the TAR.GZ archive
      - name: Create Tarball
        run: |
          cd package && tar -czf ../nextcloud-release.tar.gz ${{ github.event.repository.name }}

      # Step 10: Sign the TAR.GZ file with OpenSSL
      - name: Sign the TAR.GZ file with OpenSSL
        run: |
          openssl dgst -sha512 -sign signing-key.key nextcloud-release.tar.gz | openssl base64 -out nextcloud-release.signature

      # Step 11: Create a new GitHub prerelease for this build (allowUpdates covers workflow re-runs)
      - name: Upload OpenPDD Release
        uses: ncipollo/release-action@v1.12.0
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: OpenPDD Release ${{ env.NEW_VERSION }}
          draft: false
          prerelease: true
          allowUpdates: true
          removeArtifacts: true

      # Step 12: Attach the tarball as a release asset (overwrites the previous asset)
      - name: Attach tarball to GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: nextcloud-release.tar.gz
          asset_name: ${{ env.APP_NAME }}-${{ env.RELEASE_TAG }}.tar.gz
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true

      # Step 13: Verify contents
      - name: Verify version and contents
        run: |
          echo "App version: ${{ env.NEW_VERSION }}"
          echo "Tarball contents:"
          tar -tvf nextcloud-release.tar.gz
          echo "info.xml contents:"
          tar -xOf nextcloud-release.tar.gz ${{ env.APP_NAME }}/appinfo/info.xml
