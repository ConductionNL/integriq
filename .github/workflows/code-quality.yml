name: Code Quality

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    # Spelled out rather than left to the default so the set is reviewable.
    # `synchronize` — a push to an open PR — is the load-bearing one: without
    # it the suite runs once at PR-open and every later commit merges unchecked
    # under the first run's green tick. Cost is bounded by the `concurrency`
    # block below, which cancels the in-flight run for the same head ref.
    types: [opened, reopened, synchronize]
    branches: [main, beta, development]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# The called workflow contains jobs that declare `contents: write` and
# `actions: write` (coverage-baseline update, journeydoc capture, SBOM). A
# caller cannot grant a reusable workflow more than it holds itself, so capping
# this at `read` makes the whole call fail to START — zero jobs, no
# annotations, indistinguishable from "nothing to run".
permissions:
  contents: write
  actions: write
  packages: read

jobs:
  quality:
    # Skip the duplicate run a branch-creation push fires alongside the PR event.
    if: github.event_name != 'push' || github.event.created != true
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: openconnector
      # composer.json `config.platform.php` is pinned to 8.3, so phpcs/phpmd/etc
      # need the matching runtime or `vendor/composer/platform_check.php` aborts
      # with `Composer dependencies require a PHP version ">= 8.3.0"`.
      php-version: "8.3"
      enable-phpcs: true
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      # Integration + E2E run against a live Nextcloud server with OR
      # checked out as an additional app (collections + journeys exercise
      # /index.php/apps/openregister/api/objects/openconnector/*).
      enable-newman: true
      newman-collection-path: "tests/postman"
      newman-environment-path: "tests/postman/openconnector.postman_environment.json"
      # ⚠️ TODO — ENABLE THIS ONE LINE ONCE ConductionNL/.github#132 IS MERGED:
      #
      #   newman-seed-command: 'SEED_SCOPE=register bash apps/openconnector/tests/e2e/ci-seed.sh'
      #
      # WHY IT IS NEEDED. The collection's "01 — Fixture setup (via OR)" folder
      # POSTs to /apps/openregister/api/objects/openconnector/<schema>; since
      # the chain-C cutover every openconnector entity is an OpenRegister
      # object. This job has no seed step, so the `openconnector` register does
      # not exist, all 8 fixture POSTs return 404, and that cascades into 51 of
      # 107 failing assertions (run 30816264169). The Playwright job already
      # provisions it with tests/e2e/ci-seed.sh; SEED_SCOPE=register reuses that
      # same script and stops after the import, skipping the SPA warm-up and
      # bundle gate that this job (which never runs `npm run build`) must not
      # execute. That part is verified: with the line enabled, "Seed test data"
      # completed successfully and the fixtures returned 201 Created.
      #
      # WHY IT IS COMMENTED OUT. Enabling it makes the job hang instead of
      # fail. The shared workflow starts this job's `php -S` SINGLE-WORKER
      # (only the Playwright job sets PHP_CLI_SERVER_WORKERS). Journey J2 points
      # a Source at this very instance and then runs a synchronization against
      # it, so the app calls back into the server while the one worker is still
      # inside the outer request — a deadlock. Measured on run 30821823343: J2.1
      # and J2.2 returned 201, `J2.3 test sync (dry-run)` never returned, and the
      # job was cancelled by timeout-minutes after ~30 minutes. Failing fast with
      # 51 assertions is less costly than burning half an hour of runner time on
      # every PR, so this stays off until the workers fix lands.
      additional-apps: '[{"repo":"ConductionNL/openregister","app":"openregister","ref":"development"}]'

      # ── E2E browser tests ────────────────────────────────────────────────
      # `playwright-test-path` does double duty in the shared workflow:
      #   1. it is the directory the "Validate Playwright tests exist" step
      #      counts *.spec.ts in;
      #   2. it is the FIRST place the run step looks for a config —
      #      `${playwright-test-path}/playwright.config.ts`, falling back to
      #      the repo root only if that file is absent.
      # It used to say `tests/e2e/regression`, which holds no config, so lookup
      # (2) fell through to the ROOT config. The run step passes no
      # `--project`, so all four root projects ran at once — 243 tests in 1.6h,
      # including `visual` (pixel baselines the root config itself documents as
      # un-matchable on a CI Linux runner) and `docs-capture` (screenshot
      # re-shoots that have their own dedicated job). `tests/e2e` makes lookup
      # (1) hit tests/e2e/playwright.config.ts, which declares exactly one
      # project over spec-coverage/ + regression/ + workflows/.
      enable-playwright: true
      playwright-test-path: tests/e2e
      # openconnector's sources/mappings/synchronizations/jobs are OpenRegister
      # OBJECTS — there is no `oc_openconnector_*` table for them — so with no
      # `openconnector` register the SPA has nothing to resolve and the suite
      # reports it as a wall of selector timeouts. `occ app:enable` is not a
      # reliable provisioning path for it: the InitializeRegister repair step
      # swallows its own failures as warnings and occ still exits 0. The script
      # provisions explicitly and fails loudly when the register or its schemas
      # are still absent. cwd for this step is the Nextcloud server root.
      playwright-seed-command: 'bash apps/openconnector/tests/e2e/ci-seed.sh'
