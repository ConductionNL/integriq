name: Code Quality

on:
  # `push` on main is the load-bearing one, and it was MISSING. Without it a
  # push to the release branch built nothing at all — not red, not green,
  # simply no run. Measured 2026-08-09: openconnector `main` had ZERO Code
  # Quality runs on record, so nobody could say what state the branch users
  # install was in. A branch with no runs shows no red.
  #
  # `development` has carried this trigger for some time; it never reached
  # `main` because the corrected workflow travels the release train and no
  # release has carried it across. See ConductionNL/.github#285.
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    branches: [main, master, development]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  php-checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: "PHP Lint", command: "composer lint" }
          - { name: "PHPCS", command: "./vendor/bin/phpcs --standard=phpcs.xml" }
          - { name: "PHPMD", command: "./vendor/bin/phpmd lib text phpmd.xml" }
          - { name: "Psalm", command: "./vendor/bin/psalm --threads=1 --no-cache --output-format=github" }
          - { name: "PHPStan", command: "./vendor/bin/phpstan analyse --memory-limit=1G" }
          - { name: "PHPUnit", command: "./vendor/bin/phpunit --colors=always" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, iconv, intl, dom, filter, gd, json, posix, zip, soap
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Stylelint
        run: npm run stylelint
