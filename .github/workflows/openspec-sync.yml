name: OpenSpec Sync

on:
  push:
    branches: [development]
    paths: ['openspec/**']
  workflow_dispatch:

jobs:
  sync:
    # `@main`, not `@feature/openspec-project-sync` — that branch no longer
    # exists on ConductionNL/.github, so the reference was unresolvable.
    uses: ConductionNL/.github/.github/workflows/openspec-sync.yml@main
    with:
      app-name: openconnector
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
