name: WOO-552 Hotfix Release

# WOO-552 — custom hotfix release voor de WOO-stable-lijn.
# Draait NIET op main; produceert een prerelease die door
# Nextcloud NIET als "latest" wordt opgepikt (zie `prerelease: true`
# in de release-action). Installatie op accept/productie gebeurt
# handmatig via `occ` of de `app_versions` app.
#
# Naamgeving-conventie (Barry's voorstel, 2026-09-03):
#   <base_tag>-<project>-<version>
# Voor WOO-552 op v0.2.24 → tag = `v0.2.24-woo-1`. Geen build-
# nummer append; elke push naar deze branch overschrijft
# dezelfde tag/release (via `allowUpdates` + `overwrite: true`).
# Voor een tweede WOO-hotfix op dezelfde base-tag: bump
# `<version>` in `appinfo/info.xml` naar `0.2.24-woo-2` etc.
# Ruben + Remko hebben nog niet formeel gereageerd; als zij
# uiteindelijk een andere shape voorstellen kost switch één
# commit + info.xml bump + één nieuwe workflow-run.
#
# Basis: ConductionNL/integriq @ project/openpdd →
#        .github/workflows/openpdd-release.yaml (Barry, 2026-09-03).
#
# BRANCH-CONVENTIE (afgesproken 2026-09-22, WOO-572): ÉÉN hotfix-branch per
# basisversie, genaamd hotfix/v<basis>-woo, met daarop élke woo-N-release die
# op die basis gecut wordt. Werk op een feature-branch, merge die hierin, bump
# <version> in appinfo/info.xml naar de volgende <basis>-woo-N en push; de push
# cut de tag. Maak nooit een tweede branch op dezelfde basis: een WOO-omgeving
# draait ÉÉN build per app, dus twee branches op één basis betekent dat de
# laatste deploy stilzwijgend de fixes van de andere laat vallen (gebeurde met
# v0.2.24-woo-2 op 2026-09-09 en met v1.1.5-woo-1 op 2026-09-21). De stap
# "Refuse to cut a WOO tag from the wrong branch" dwingt naam, versie-segment
# en afstamming af. Pushes die alleen .github/ raken cutten geen release.
on:
  push:
    branches:
      - hotfix/v0.2.24-woo
    paths-ignore:
      - '.github/**'

jobs:
  release-management:
    runs-on: ubuntu-latest
    steps:

      # Step 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Step 2: The build's version IS the base version tracked in
      # appinfo/info.xml. No per-build run number is appended — every push
      # to this branch overwrites the same release/tag (allowed via
      # `allowUpdates: true` on ncipollo/release-action + `overwrite: true`
      # on svenstaro/upload-release-action). Bump the base version by hand
      # in appinfo/info.xml when you want a NEW hotfix line
      # (e.g. 0.2.24-woo-1 → 0.2.24-woo-2 for a follow-up hotfix on the
      # same base tag).
      - name: Set app env
        run: |
          # Hard-coded to the Nextcloud app id, NOT ${GITHUB_REPOSITORY##*/}:
          # this repo was renamed to `integriq` upstream but the app id stays
          # `openconnector` (info.xml <id>openconnector</id>). Using the repo
          # name would give the tarball an `integriq/` root dir, which
          # `occ app:install` refuses because it does not match the app id.
          echo "APP_NAME=openconnector" >> $GITHUB_ENV
          new_version=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml)
          echo "NEW_VERSION=${new_version}" >> $GITHUB_ENV
          echo "RELEASE_TAG=v${new_version}" >> $GITHUB_ENV

      # WOO hotfix-line guard (2026-09-22). The workflow file travels with any
      # copy of this branch, so the guard refuses to cut a tag from anywhere but
      # the one hotfix line for this base. Each check maps to a real incident:
      #   1. branch name        — hotfix/v<base>-woo, nothing else;
      #   2. version segment    — info.xml must read <base>-woo-<N> for THIS base
      #                           (v1.1.5-woo-1 was overwritten from a second
      #                           branch on the same base, 2026-09-21);
      #   3. ancestry           — what the branch shares with main/development
      #                           must not be newer than the base tag v<base>
      #                           (v0.2.24-woo-2 was re-cut from a development-
      #                           based branch that had merged the tag in, 2026-09-09);
      #   4. existing tag       — if the tag exists it must already be on this
      #                           branch; never move someone else's tag.
      - name: Refuse to cut a WOO tag from the wrong branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "${BRANCH}" in
            hotfix/v*-woo) ;;
            *) echo "::error::${BRANCH} is not a WOO hotfix line (expected hotfix/v<base>-woo); refusing to cut ${RELEASE_TAG}"; exit 1 ;;
          esac
          line="${BRANCH#hotfix/v}"
          case "${NEW_VERSION}" in
            "${line}"-[1-9]*) ;;
            *) echo "::error::appinfo/info.xml says ${NEW_VERSION}; on ${BRANCH} only ${line}-<N> may be cut"; exit 1 ;;
          esac
          base_tag="v${line%-woo}"
          git fetch -q origin main development "refs/tags/${base_tag}:refs/tags/${base_tag}" 2>/dev/null || true
          git merge-base --is-ancestor "${base_tag}" HEAD \
            || { echo "::error::${BRANCH} does not descend from ${base_tag}"; exit 1; }
          for ref in main development; do
            git rev-parse -q --verify "origin/${ref}" >/dev/null || continue
            shared="$(git merge-base HEAD "origin/${ref}")"
            if ! git merge-base --is-ancestor "${shared}" "${base_tag}"; then
              echo "::error::${BRANCH} shares $(git rev-parse --short "${shared}") with origin/${ref}, which is newer than ${base_tag}; this is not a hotfix line on ${base_tag}"; exit 1
            fi
          done
          if git fetch -q origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" 2>/dev/null \
             && ! git merge-base --is-ancestor "${RELEASE_TAG}" HEAD; then
            echo "::error::${RELEASE_TAG} already exists at $(git rev-parse --short "${RELEASE_TAG}") and is not on ${BRANCH}; refusing to move someone else's tag"; exit 1
          fi
          echo "${NEW_VERSION} belongs on ${BRANCH}; ${RELEASE_TAG} may be cut from ${GITHUB_SHA}"

      # Step 3: Prepare the signing certificate and key
      - name: Prepare Signing Certificate and Key
        run: |
          echo "${{ secrets.NEXTCLOUD_SIGNING_CERT }}" > signing-cert.crt
          echo "${{ secrets.NEXTCLOUD_SIGNING_KEY }}" > signing-key.key

      # Step 4: Install Node.js
      - name: Install npm dependencies
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      # Step 5: Set up PHP
      - name: Set up PHP and install extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, gd

      # Step 6: Build
      - run: npm ci
      - run: npm run build
      - run: composer install --no-dev

      # Step 7: Copy the package files into the package directory
      - name: Copy the package files into the package
        run: |
          mkdir -p package/${{ env.APP_NAME }}
          rsync -av --progress \
            --exclude='package' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='docker' \
            --exclude='docs' \
            --exclude='website' \
            --exclude='node_modules' \
            --exclude='/src' \
            --exclude='test' \
            --exclude='tests' \
            --exclude='package-lock.json' \
            --exclude='composer.lock' \
            --exclude='composer-setup.php' \
            --exclude='.phpunit.result.cache' \
            --exclude='phpmd.xml' \
            --exclude='signing-key.key' \
            --exclude='package.json' \
            --exclude='composer.json' \
            --exclude='coverage.txt' \
            --exclude='signing-cert.crt' \
            --exclude='docker-compose.yml' \
            --exclude='webpack.config.js' \
            --exclude='.prettierrc' \
            --exclude='psalm.xml' \
            --exclude='phpunit.xml' \
            --exclude='tsconfig.json' \
            --exclude='changelog-ci-config.json' \
            --exclude='jest.config.js' \
            --exclude='.gitattributes' \
            --exclude='.php-cs-fixer.dist.php' \
            --exclude='.gitignore' \
            --exclude='.eslintrc.js' \
            --exclude='stylelint.config.js' \
            --exclude='.babelrc' \
            --exclude='.nvmrc' \
            ./ package/${{ env.APP_NAME }}/

      # Step 8: Stamp the branch release version into the packaged info.xml
      # only (the repo's own info.xml / main version history is left
      # untouched).
      - name: Set package version
        run: |
          sed -i "s|<version>.*</version>|<version>${{ env.NEW_VERSION }}</version>|" package/${{ env.APP_NAME }}/appinfo/info.xml

      # Step 9: Create the TAR.GZ archive
      - name: Create Tarball
        run: |
          cd package && tar -czf ../nextcloud-release.tar.gz ${{ env.APP_NAME }}

      # Step 10: Sign the TAR.GZ file with OpenSSL
      - name: Sign the TAR.GZ file with OpenSSL
        run: |
          openssl dgst -sha512 -sign signing-key.key nextcloud-release.tar.gz | openssl base64 -out nextcloud-release.signature

      # Step 11: Create a new GitHub prerelease for this build.
      # `prerelease: true` is the mechanism that keeps Nextcloud from
      # picking this up as "latest" — this build only becomes available
      # via manual `occ` installation or the `app_versions` app.
      - name: Upload WOO-552 Hotfix Release
        uses: ncipollo/release-action@v1.12.0
        with:
          tag: ${{ env.RELEASE_TAG }}
          # Pin the tag to the commit that was built. Without this GitHub
          # creates the tag on the DEFAULT branch (main): v0.2.24-woo-1/2/3
          # pointed at main while the tarball came from this branch.
          commit: ${{ github.sha }}
          name: WOO-552 Hotfix Release ${{ env.NEW_VERSION }}
          draft: false
          prerelease: true
          allowUpdates: true
          removeArtifacts: true

      # Step 12: Attach the tarball as a release asset (overwrites the
      # previous asset).
      - name: Attach tarball to GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: nextcloud-release.tar.gz
          asset_name: ${{ env.APP_NAME }}-${{ env.RELEASE_TAG }}.tar.gz
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true

      # Step 13: Verify contents
      - name: Verify version and contents
        run: |
          echo "App version: ${{ env.NEW_VERSION }}"
          echo "Tarball contents:"
          tar -tvf nextcloud-release.tar.gz
          echo "info.xml contents:"
          tar -xOf nextcloud-release.tar.gz ${{ env.APP_NAME }}/appinfo/info.xml
