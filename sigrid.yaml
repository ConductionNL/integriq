# Sigrid analysis scope for IntegrIQ (repo openconnector).
#
# Every key below is documented at
# https://docs.sigrid-says.com/reference/analysis-scope-configuration.html
# Sigrid's default excludes (node_modules, vendor, build output, docs, migrations,
# mocks and stubs) still apply on top of this file. ARCHITECTURE.md explains the
# component map and the directory roles in prose.

# Pin the maintainability model, so a yearly recalibration never changes the
# rating without a deliberate change to this file.
model: "2026"

# The technologies we write. Listing them switches off automatic detection, so
# shell and Python helper scripts under scripts/ are not analysed.
languages:
  - name: php
    production:
    test:
      include:
        - ".*/tests/.*[.]php"
  - name: javascript
    production:
    test:
      include:
        - ".*/tests/.*"
        - ".*/__tests__/.*"
        - ".*/__mocks__/.*"
        - ".*[.](spec|test)[.](js|mjs|cjs|ts)"
        - ".*[.]mock[.](js|ts)"
  - name: typescript
    production:
    test:
      include:
        - ".*/tests/.*"
        - ".*/__tests__/.*"
        - ".*/__mocks__/.*"
        - ".*[.](spec|test)[.](js|mjs|cjs|ts)"
        - ".*[.]mock[.](js|ts)"
  - name: vue
    production:
    test:
      include:
        - ".*/tests/.*[.]vue"

# Only code that is not ours, or that a tool writes, is excluded.
exclude:
  # Translation catalogues. l10n/<locale>.js is generated from l10n/<locale>.json
  # (an OC.L10N.register() call around the same key/value pairs); neither holds logic.
  - ".*/l10n/.*"

# Functional components instead of the technical layers (Controller, Service, Db).
# A file belongs to the first component whose pattern matches its class name or
# directory; each component excludes the patterns of the components above it.
components:
  # Adapters for StUF, ZGW, DSO, OSO, ROD, UWLR, iWMO/iJW, FSC and similar Dutch exchange standards.
  - name: "Government protocols"
    include:
      - ".*/lib/.*(Stuf|Zgw|Dso|DSO|Objecten|Kiss|CaseSystem|Rod|Oso|Uwlr|Verzuimloket|IwmoIjw|Fsc|Digikoppeling|Exchange|Pdok|Cti|Eudi|Lti|Notificaties|Registry|Catalog|Tables|Forms|OpenFormulieren|Adapter).*[.]php"
  # Mail, digital post, SMS, Peppol, payments, document generation and outbound delivery.
  - name: "Messaging and delivery"
    include:
      - ".*/lib/.*(Mail|DigitalPost|Sms|Berichtenbox|NotifyNl|Peppol|Delivery|Recipient|Outbound|SenderIdentity|OptOut|Unsubscribe|Intake|DocumentGeneration|Document[A-Z]|Payment|Psd2|Cardfeed|Bankfeed|MessageValidation|Message[A-Z]).*[.]php"
    exclude:
      - ".*/lib/.*(Stuf|Zgw|Dso|DSO|Objecten|Kiss|CaseSystem|Rod|Oso|Uwlr|Verzuimloket|IwmoIjw|Fsc|Digikoppeling|Exchange|Pdok|Cti|Eudi|Lti|Notificaties|Registry|Catalog|Tables|Forms|OpenFormulieren|Adapter).*[.]php"
  # Flows, mappings, rules, actions, jobs, expressions and approvals.
  - name: "Flows and mappings"
    include:
      - ".*/lib/.*(Flow|Mapping|Rule|/Action/|Action[A-Z]|Job|Expression|Twig|PropertySource|Approval|Verdict|Promotion|ExecutionTrace|RunSummary|Workflow|AgentTools).*[.]php"
    exclude:
      - ".*/lib/.*(Stuf|Zgw|Dso|DSO|Objecten|Kiss|CaseSystem|Rod|Oso|Uwlr|Verzuimloket|IwmoIjw|Fsc|Digikoppeling|Exchange|Pdok|Cti|Eudi|Lti|Notificaties|Registry|Catalog|Tables|Forms|OpenFormulieren|Adapter).*[.]php"
      - ".*/lib/.*(Mail|DigitalPost|Sms|Berichtenbox|NotifyNl|Peppol|Delivery|Recipient|Outbound|SenderIdentity|OptOut|Unsubscribe|Intake|DocumentGeneration|Document[A-Z]|Payment|Psd2|Cardfeed|Bankfeed|MessageValidation|Message[A-Z]).*[.]php"
  # Sources, synchronisations, contracts, ownership, provenance and directory sync.
  - name: "Synchronisation"
    include:
      - ".*/lib/.*(Synchroni[sz]|Sync|Contract|Source|Datasource|Ownership|Provenance|DeadLetter|Directory|Scim|Migrat).*[.]php"
    exclude:
      - ".*/lib/.*(Stuf|Zgw|Dso|DSO|Objecten|Kiss|CaseSystem|Rod|Oso|Uwlr|Verzuimloket|IwmoIjw|Fsc|Digikoppeling|Exchange|Pdok|Cti|Eudi|Lti|Notificaties|Registry|Catalog|Tables|Forms|OpenFormulieren|Adapter).*[.]php"
      - ".*/lib/.*(Mail|DigitalPost|Sms|Berichtenbox|NotifyNl|Peppol|Delivery|Recipient|Outbound|SenderIdentity|OptOut|Unsubscribe|Intake|DocumentGeneration|Document[A-Z]|Payment|Psd2|Cardfeed|Bankfeed|MessageValidation|Message[A-Z]).*[.]php"
      - ".*/lib/.*(Flow|Mapping|Rule|/Action/|Action[A-Z]|Job|Expression|Twig|PropertySource|Approval|Verdict|Promotion|ExecutionTrace|RunSummary|Workflow|AgentTools).*[.]php"
  # Endpoints, gateways, consumers, authentication, brokers, webhooks and connection monitoring.
  - name: "Gateway and connections"
    include:
      - ".*/lib/.*(Endpoint|Gateway|Consumer|Auth|Security|Mtls|RateLimit|Scope|Idp|Broker|Bridge|Webhook|Event|CloudEvent|Subscription|Connection|Health|Metric|Otel|Observability|CallLog|Call[A-Z]|Log).*[.]php"
    exclude:
      - ".*/lib/.*(Stuf|Zgw|Dso|DSO|Objecten|Kiss|CaseSystem|Rod|Oso|Uwlr|Verzuimloket|IwmoIjw|Fsc|Digikoppeling|Exchange|Pdok|Cti|Eudi|Lti|Notificaties|Registry|Catalog|Tables|Forms|OpenFormulieren|Adapter).*[.]php"
      - ".*/lib/.*(Mail|DigitalPost|Sms|Berichtenbox|NotifyNl|Peppol|Delivery|Recipient|Outbound|SenderIdentity|OptOut|Unsubscribe|Intake|DocumentGeneration|Document[A-Z]|Payment|Psd2|Cardfeed|Bankfeed|MessageValidation|Message[A-Z]).*[.]php"
      - ".*/lib/.*(Flow|Mapping|Rule|/Action/|Action[A-Z]|Job|Expression|Twig|PropertySource|Approval|Verdict|Promotion|ExecutionTrace|RunSummary|Workflow|AgentTools).*[.]php"
      - ".*/lib/.*(Synchroni[sz]|Sync|Contract|Source|Datasource|Ownership|Provenance|DeadLetter|Directory|Scim|Migrat).*[.]php"
  # Bootstrap, settings, repair steps, commands, shared exceptions and helpers.
  - name: "Application wiring"
    include:
      - ".*/lib/.*[.]php"
      - ".*/appinfo/.*"
      - ".*/templates/.*[.]php"
    exclude:
      - ".*/lib/.*(Stuf|Zgw|Dso|DSO|Objecten|Kiss|CaseSystem|Rod|Oso|Uwlr|Verzuimloket|IwmoIjw|Fsc|Digikoppeling|Exchange|Pdok|Cti|Eudi|Lti|Notificaties|Registry|Catalog|Tables|Forms|OpenFormulieren|Adapter).*[.]php"
      - ".*/lib/.*(Mail|DigitalPost|Sms|Berichtenbox|NotifyNl|Peppol|Delivery|Recipient|Outbound|SenderIdentity|OptOut|Unsubscribe|Intake|DocumentGeneration|Document[A-Z]|Payment|Psd2|Cardfeed|Bankfeed|MessageValidation|Message[A-Z]).*[.]php"
      - ".*/lib/.*(Flow|Mapping|Rule|/Action/|Action[A-Z]|Job|Expression|Twig|PropertySource|Approval|Verdict|Promotion|ExecutionTrace|RunSummary|Workflow|AgentTools).*[.]php"
      - ".*/lib/.*(Synchroni[sz]|Sync|Contract|Source|Datasource|Ownership|Provenance|DeadLetter|Directory|Scim|Migrat).*[.]php"
      - ".*/lib/.*(Endpoint|Gateway|Consumer|Auth|Security|Mtls|RateLimit|Scope|Idp|Broker|Bridge|Webhook|Event|CloudEvent|Subscription|Connection|Health|Metric|Otel|Observability|CallLog|Call[A-Z]|Log).*[.]php"
  # The Vue front end.
  - name: "Web interface"
    include:
      - ".*/src/.*"
    exclude:
      - ".*/lib/.*(Stuf|Zgw|Dso|DSO|Objecten|Kiss|CaseSystem|Rod|Oso|Uwlr|Verzuimloket|IwmoIjw|Fsc|Digikoppeling|Exchange|Pdok|Cti|Eudi|Lti|Notificaties|Registry|Catalog|Tables|Forms|OpenFormulieren|Adapter).*[.]php"
      - ".*/lib/.*(Mail|DigitalPost|Sms|Berichtenbox|NotifyNl|Peppol|Delivery|Recipient|Outbound|SenderIdentity|OptOut|Unsubscribe|Intake|DocumentGeneration|Document[A-Z]|Payment|Psd2|Cardfeed|Bankfeed|MessageValidation|Message[A-Z]).*[.]php"
      - ".*/lib/.*(Flow|Mapping|Rule|/Action/|Action[A-Z]|Job|Expression|Twig|PropertySource|Approval|Verdict|Promotion|ExecutionTrace|RunSummary|Workflow|AgentTools).*[.]php"
      - ".*/lib/.*(Synchroni[sz]|Sync|Contract|Source|Datasource|Ownership|Provenance|DeadLetter|Directory|Scim|Migrat).*[.]php"
      - ".*/lib/.*(Endpoint|Gateway|Consumer|Auth|Security|Mtls|RateLimit|Scope|Idp|Broker|Bridge|Webhook|Event|CloudEvent|Subscription|Connection|Health|Metric|Otel|Observability|CallLog|Call[A-Z]|Log).*[.]php"
      - ".*/lib/.*[.]php"
  # Build, quality and release tooling: helper scripts and root-level tool configuration.
  - name: "Developer tooling"
    include:
      - ".*/scripts/.*"
      - ".*/tools/.*"
      - ".*/vendor-bin/.*"
      - ".*/[^/]*[.]config[.]m?[jt]s"
      - ".*/phpstan-bootstrap[.]php"
      - ".*/[.]php-cs-fixer[.]dist[.]php"
    exclude:
      - ".*/lib/.*[.]php"
      - ".*/src/.*"
