publiccodeYmlVersion: '0.4'

name: Integriq
url: https://github.com/ConductionNL/integriq
landingURL: https://conductionnl.github.io/integriq/
logo: img/app-store.svg
softwareVersion: '0.4.4'
releaseDate: '2026-09-12'
developmentStatus: stable
softwareType: addon

platforms:
  - web

categories:
  - data-collection

