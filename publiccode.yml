  countries:
    - nl
  scope:
    - government

description:
  en:
    shortDescription: >-
      Gateway and service bus for Nextcloud: synchronise data sources,
      send cloud events, and map API calls.
    longDescription: >-
      Integriq brings gateway and service bus functionality to Nextcloud.
      It provides an ESB-framework for working together in an open data
      ecosystem: synchronise external data sources, emit cloud events,
      and translate API calls through configurable mappings.
      Conduction maintains this component on behalf of OpenWoo.app.
      Install it from the Nextcloud App Store at https://apps.nextcloud.com/apps/integriq.
    features:
      - Connect REST, SOAP and XML APIs as sources
      - OAuth 2.0, JWT, API key and Basic authentication
      - Expose external APIs through Nextcloud endpoints
      - Rules on endpoints for authentication, mapping and file handling
      - Field mapping and Twig based data transformation
      - Synchronisation between systems with change detection
      - Per-object synchronisation contracts for incremental sync
      - Scheduled jobs and event driven synchronisation
      - Cloud event publishing
      - Data stored as OpenRegister objects
    screenshots:
      - img/screenshot-dashboard.png
      - img/screenshot-sources.png
      - img/screenshot-mappings.png
  nl:
    shortDescription: >-
      Gateway en servicebus voor Nextcloud: synchroniseer databronnen,
      verstuur cloud events en vertaal API-aanroepen.
    longDescription: >-
      Integriq biedt gateway- en servicebusfunctionaliteit voor Nextcloud.
      Het levert een ESB-raamwerk voor samenwerking in een open data-ecosysteem:
      synchroniseer externe databronnen, publiceer cloud events en vertaal
      API-aanroepen via configureerbare mappings.
      Conduction onderhoudt dit component in opdracht van OpenWoo.app.
      Installeer het via de Nextcloud App Store op https://apps.nextcloud.com/apps/integriq.
    features:
      - REST-, SOAP- en XML-API's koppelen als bron
      - Authenticatie met OAuth 2.0, JWT, API-sleutel en Basic
      - Externe API's aanbieden via Nextcloud-endpoints
      - Regels op endpoints voor authenticatie, mapping en bestanden
      - Veldmapping en datatransformatie met Twig
      - Synchronisatie tussen systemen met wijzigingsdetectie
      - Synchronisatiecontracten per object voor incrementele sync
      - Geplande taken en synchronisatie op basis van events
      - Publiceren van cloud events
      - Gegevens opgeslagen als OpenRegister-objecten
    screenshots:
      - img/screenshot-dashboard.png
      - img/screenshot-sources.png
      - img/screenshot-mappings.png

